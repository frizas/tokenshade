name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Validate TokenShade
        run: |
          npm test
          npm run check
          npm run benchmark -- --dry-run --json
      - name: Install site dependencies
        run: npm ci --prefix site --ignore-scripts --no-audit --no-fund
      - name: Build and test site
        run: npm test --prefix site
      - name: Build Vercel static export
        env:
          VERCEL: "1"
        run: npm run build:vercel --prefix site
