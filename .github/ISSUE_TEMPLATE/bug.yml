name: Bug report
description: Report a reproducible TokenShade defect
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not paste credentials, prompts, private session logs, or private repository content.
  - type: input
    id: version
    attributes:
      label: TokenShade version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include sanitized reproduction steps and expected behavior.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Sanitized output
      render: text
